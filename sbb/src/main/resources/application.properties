# 애플리케이션 이름. 로그나 모니터링에서 이 프로젝트를 구분할 때 쓰입니다.
spring.application.name=sbb

# 서버 포트 번호. 이 설정 때문에 브라우저 주소는 http://localhost:8070 입니다.
# (기본값은 8080이지만, 여기서는 8070으로 바꿨습니다)
server.port=8070

# ----------------------------------------------------------
# DATABASE (데이터베이스 연결 설정)
# ----------------------------------------------------------
# H2 콘솔(웹에서 DB를 보는 화면)을 켤지 여부입니다. true 면 사용합니다.
# H2 콘솔은 H2 데이터베이스를 웹 UI로 보여 주는 도구입니다. 개발할 때만 사용합니다.
spring.h2.console.enabled=true
# H2 콘솔에 접속하는 주소 경로입니다. → http://localhost:8070/h2-console
spring.h2.console.path=/h2-console
# 데이터베이스 접속 주소(JDBC URL)입니다.
# jdbc:h2:~/local → 사용자 홈 폴더(~) 아래에 local.mv.db 라는 DB 파일을 만들어서 사용합니다.
# 데이터가 파일로 남기 때문에 서버를 껐다 켜도 데이터가 유지됩니다.
spring.datasource.url=jdbc:h2:~/local
# 사용할 DB 드라이버(JDBC 연결을 실제로 해 주는 클래스)의 이름입니다.
spring.datasource.driverClassName=org.h2.Driver
# DB 접속 사용자명입니다. H2 의 기본 사용자명은 sa 입니다.
spring.datasource.username=sa
# DB 접속 비밀번호입니다. 개발용이라 비워 두었습니다. (실제 서비스라면 반드시 비밀번호를 설정해야 합니다)
spring.datasource.password=
# ----------------------------------------------------------
# JPA (엔티티 클래스를 DB 테이블로 자동 연결하는 설정)
# ----------------------------------------------------------
# 하이버네이트(JPA 구현체)가 사용할 DB 방언(dialect)입니다.
# 방언 : 같은 SQL 이라도 DB 마다 문법이 조금씩 달라서, 어떤 DB 문법으로 만들지 알려 주는 설정입니다.
# 여기서는 H2 DB 문법을 쓰도록 H2Dialect 를 지정했습니다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# 엔티티(@Entity 클래스)를 기준으로 테이블을 어떻게 맞출지 정하는 규칙입니다.
#   none        : 아무것도 하지 않습니다. (테이블을 건드리지 않음)
#   update      : 엔티티와 테이블의 차이점만 찾아서 반영합니다. (테이블 추가/열 추가 등, 데이터 유지)
#   validate    : 엔티티와 테이블이 맞는지 검사만 합니다. (불일치하면 실행 오류)
#   create      : 서버를 켤 때 테이블을 모두 지우고 새로 만듭니다. (데이터 삭제됨)
#   create-drop: create 와 같지만, 서버를 끌 때도 테이블을 지웁니다.
# 참고: 개발 환경에서는 보통 update, 운영 환경에서는 none 또는 validate 를 씁니다.
spring.jpa.hibernate.ddl-auto=update
# SQL 을 줄바꿈과 들여쓰기를 넣어 보기 좋게 출력합니다.
spring.jpa.properties.hibernate.format_sql=true
# 실행되는 SQL 문을 콘솔(IDE 실행 창)에 출력합니다. JPA 가 어떤 SQL 을 만드는지 눈으로 확인할 수 있습니다.
# ※ 이 설정을 켜면 "[Hibernate] select ..." 형태의 로그가 찍힙니다. 바인딩 값(?에 들어간 값)은 보이지 않습니다.

# (참고) spring.jpa.open-in-view 는 설정하지 않으면 기본값이 true 입니다. (실행 로그에 경고가 찍힙니다)
#   true 이면 한 요청이 끝날 때까지 DB 연결이 살아 있어서, 화면(Thymeleaf)에서 지연 로딩이 가능합니다.
#   대신 화면을 그리는 도중에도 SQL 이 추가로 나갑니다. (질문 상세 화면의 추천자/답변 조회가 그 예) 
spring.jpa.properties.hibernate.show_sql=true
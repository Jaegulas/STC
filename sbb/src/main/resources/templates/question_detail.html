

<html layout:decorate="~{layout}">

<div layout:fragment="content" class="container my-3">
    <!-- 질문 -->
    <h2 class="border-bottom py-2" th:text="${question.subject}"></h2>
    <div class="card my-3">
        <div class="card-body">
        
       		 <div class="card-text" th:utext="${@commonUtil.markdown(question.content)}"></div>
            
             <div class="d-flex justify-content-end">
            
   				<!-- 질문 수정 일시 보여 주기 -->         
	    	    <div th:if="${question.modifyDate != null}" class="badge bg-light text-dark p-2 text-start mx-3">
	                <div class="mb-2">질문 수정 일시</div>
	                <div th:text="${#temporals.format(question.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
	            </div>
	            
                <div class="badge bg-light text-dark p-2 text-start">             
        			<!--  질문 상세 화면에서도 글쓴이 항목 이 노출되도록 -->		 
                	<div class="mb-2">
                    	<span th:if="${question.author != null}" th:text="${question.author.username}"></span>
                	</div>
                	
                	<!--  질문 상세 화면에 질문 작성일시 출력 -->
                    <div th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            <!--  질문 [수정] 요청 버튼 영역 -->
            <div class="my-3">
            	<a href="javascript:void(0);" class="recommend btn btn-sm btn-outline-secondary"
	                th:data-uri="@{|/question/vote/${question.id}|}">
	                추천 <span class="badge rounded-pill bg-success" th:text="${#lists.size(question.voter)}"></span>
           		 </a>	
            
            
            	 <!--/* 수정 링크 <a> 태그의 속성을 위에서 아래 순서대로 설명합니다.
			
			        th:href="@{|/question/modify/${question.id}|}"
			          - 수정 링크 <a> 클릭했을 때 질문 수정요청 주소를 만듭니다.
			          - ${question.id} 자리에 수정할 질문의 아이디가 들어갑니다. 예: 질문 번호가 3이면 /question/modify/3
			          - 클릭하면 서버로 GET /question/modify/{질문번호} 요청이 전송됩니다.
			
			        sec:authorize="isAuthenticated()"
			          - 로그인한 상태이면 true 이고, 이 태그를 HTML 에 남깁니다.
			          - 로그인하지 않았으면 false 이고, 이 <a> 태그 전체를 HTML 에서 삭제합니다.
			
			        th:if="${question.author != null and
			                  #authentication.getPrincipal().getUsername() == question.author.username}"
			          - 이 조건이 true 일 때만 <a> 태그를 출력합니다. 두 조건을 모두 만족해야 합니다.
			          - question.author != null
			              : 질문에 작성자 정보가 있는지 확인합니다. 작성자가 없으면 비교 자체를 하지 않습니다.
			          - and
			              : 앞뒤 조건이 모두 true 여야 전체가 true 가 됩니다.
			          - #authentication.getPrincipal().getUsername()
			              : 지금 로그인한 사용자의 아이디를 가져옵니다.
			          - == question.author.username
			              : 로그인한 사용자 아이디와 질문 작성자 아이디가  같은지 비교합니다.	    
			    */-->	
	            <a th:href="@{|/question/modify/${question.id}|}" class="btn btn-sm btn-outline-secondary"
	                sec:authorize="isAuthenticated()"
	                th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"
	                th:text="수정"></a>
	                
	            <a href="javascript:void(0);" th:data-uri="@{|/question/delete/${question.id}|}"
	                class="delete btn btn-sm btn-outline-secondary" sec:authorize="isAuthenticated()"
	                th:if="${question.author != null and #authentication.getPrincipal().getUsername() == question.author.username}"
	                th:text="삭제"></a>    
	                        
        	</div>
        </div>
    </div>
    <!-- 답변의 갯수 표시 -->
    <h5 class="border-bottom my-3 py-2" 
        th:text="|${#lists.size(question.answerList)}개의 답변이 있습니다.|"></h5>
    <!-- 답변 반복 시작 -->
    <div class="card my-3" th:each="answer : ${question.answerList}">
   	    <!--/*
	        [앵커 a 태그] AnswerController에 작성한 답변 등록, 수정, 추천 기능의 메소드에서 리턴해서 보여지는 
	        			question_detail.html 질문상세화면 내부의 조회한 답변목록 영역에 가서 
	        			특정 답변영역을 브라우저에  보이게할 "위치"를 지정하는 태그 
	        
	        th:id    : Thymeleaf 속성입니다. 서버가 HTML을 만들 때
	                   id="..." 의 값을 계산해서 넣습니다.
	                   브라우저에는 th:id가 빠지고 id 속성만 전달됩니다.
	                   	
	                   <a id="answer_5"></a>
	        
	        |...|     : 이 기호 사이의 문자열을 하나의 값으로 만듭니다.
	                   ${answer.id} 부분만 실제 값으로 바뀌고 나머지는 그대로 남습니다.
	                   ( | | 를 쓰지 않으면 'answer_' + ${answer.id} 로 써야 합니다 )
	        
	        ${answer.id}: 현재 반복 중인 답변 객체의 id(DB 기본키)입니다.
	                   기본키는 중복되지 않으므로 앵커 id도 유일하게 됩니다.
	    */-->
    	<a th:id="|answer_${answer.id}|"></a>
    	
   			 	 
        <div class="card-body">
        
			<div class="card-text" th:utext="${@commonUtil.markdown(answer.content)}"></div>    
			        
            <div class="d-flex justify-content-end">       
            	<!-- 답변 수정 일시  -->
				<div th:if="${answer.modifyDate != null}" class="badge bg-light text-dark p-2 text-start mx-3">
	                <div class="mb-2">답변 수정일시</div>
	                <div th:text="${#temporals.format(answer.modifyDate, 'yyyy-MM-dd HH:mm')}"></div>
	            </div>
            
                <div class="badge bg-light text-dark p-2 text-start">                
                	<!-- 답변 부분에도 글쓴이 아이디 노출되도록 -->
                	<div class="mb-2">
                   		 <span th:if="${answer.author != null}" th:text="${answer.author.username}"></span>
                	</div>          	
                	<!--  답변 작성한 일시도 출력 -->
                    <div th:text="${#temporals.format(answer.createDate, 'yyyy-MM-dd HH:mm')}"></div>
                </div>
            </div>
            
            <div class="my-3">
            
	            <a href="javascript:void(0);" class="recommend btn btn-sm btn-outline-secondary"
	                th:data-uri="@{|/answer/vote/${answer.id}|}">
	                추천
	                <span class="badge rounded-pill bg-success" th:text="${#lists.size(answer.voter)}"></span>
	            </a>
                       
	            <a th:href="@{|/answer/modify/${answer.id}|}" class="btn btn-sm btn-outline-secondary"
	                sec:authorize="isAuthenticated()"
	                th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
	                th:text="수정"></a>
	                
	             <a href="javascript:void(0);" th:data-uri="@{|/answer/delete/${answer.id}|}"
	                class="delete btn btn-sm btn-outline-secondary" sec:authorize="isAuthenticated()"
	                th:if="${answer.author != null and #authentication.getPrincipal().getUsername() == answer.author.username}"
	                th:text="삭제"></a>   	                
        	</div>
            
            
        </div>
    </div>
    <!-- 답변 반복 끝  -->
    <!-- 답변 작성 -->
    <form th:action="@{|/answer/create/${question.id}|}"  th:object="${answerForm}" method="post" class="my-3">
    		   
 		<!--  답변 내용을 입력하지 않았을때 오류 메세지를 보여주는 영역 -->  
		<div th:replace="~{form_errors :: formErrorsFragment}"></div>
		    
  		<!-- 등록할 답변 내용 입력 -->  
		<!--
		  ============================================================
		  [답변 내용 입력칸] 로그인 여부에 따라 입력칸 2개 중 1개만 출력합니다.
		  ============================================================
		
		  [처리되는 시점]
		    QuestionController.java 의 detail() 메서드가 "question_detail" 을 리턴하면
		    Thymeleaf 가 이 파일(question_detail.html)을 HTML 로 만듭니다.
		    이때 sec:authorize 조건을 검사해서, 조건이 false 인 textarea 는 HTML 에서 삭제합니다.
		    → 브라우저에는 textarea 가 1개만 전달됩니다.
		
		  [판단 기준]
		    로그인 성공 때 서버의 세션에 저장된 로그인 정보가 있는지 확인합니다.
		    sec:authorize 문법은 build.gradle 의 thymeleaf-extras-springsecurity6 라이브러리가 처리합니다.
		-->
		
		<!--
		  ------------------------------------------------------------
		  [1번째] 로그인하지 않은 사용자용 입력 textarea (입력 불가)
		  ------------------------------------------------------------
		  sec:authorize="isAnonymous()"
		    isAnonymous() : 로그인을 안 했으면 true, 했으면 false
		    true 이면 이 textarea 를 출력하고, false 이면 HTML 에서 삭제합니다.
		
		  disabled
		    입력칸을 비활성화합니다. 회색으로 보이고 글자를 입력할 수 없습니다.
		    disabled 인 입력칸의 값은 폼을 전송할 때 서버로 보내지지 않습니다.
		
		  th:field="*{content}"
		    *{ } 는 바깥 form 태그의 th:object="${answerForm}" 객체의 변수를 가리킵니다.
		    → answerForm 객체의 content 변수와 이 입력칸을 연결합니다.
		    HTML 로 바뀔 때 아래 3개 속성이 자동으로 만들어집니다.
		      id="content"    : 입력칸의 id
		      name="content"  : 폼 전송 시 값의 이름 (AnswerForm 의 content 변수에 저장됨)
		      입력칸의 내용     : answerForm.getContent() 값 (처음에는 비어 있음)
		-->		
        <textarea sec:authorize="isAnonymous()" disabled th:field="*{content}" class="form-control" rows="10"></textarea>
        
        
		
		<!--
		  ------------------------------------------------------------
		  [2번째] 로그인한 사용자용 입력 textarea (입력 가능)
		  ------------------------------------------------------------
		  sec:authorize="isAuthenticated()"
		    isAuthenticated() : 로그인을 했으면 true, 안 했으면 false
		    true 이면 이 textarea 를 출력하고, false 이면 HTML 에서 삭제합니다.
		
		  disabled 가 없음
		    글자를 입력할 수 있고, 폼을 전송할 때 값이 서버로 보내집니다.
		
		  th:field="*{content}"
		    1번째와 같습니다. answerForm 객체의 content 변수와 연결됩니다.
		    답변 등록 중 유효성 검사(@NotEmpty)에 실패해서 이 화면으로 돌아오면,
		    입력했던 내용이 이 칸에 다시 채워집니다.
		-->        
        <textarea sec:authorize="isAuthenticated()" th:field="*{content}" class="form-control" rows="10"></textarea>
        
        
        <!-- 
         [답변등록] 버튼을 눌렀을 때 실행 순서
		    1) 브라우저가 POST /answer/create/{질문번호} 요청을 보냅니다.
		       (form 태그의 th:action="@{|/answer/create/${question.id}|}")
		       요청 본문: content=입력한_답변내용&_csrf=토큰값
		    2) AnswerController.java 의 createAnswer() 메서드가 실행됩니다.
		       - @PreAuthorize("isAuthenticated()") : 로그인 여부 검사
		       - @Valid AnswerForm answerForm      : content 값이 비어 있는지 검사
		       - Principal principal               : 로그인한 사용자 아이디
		    3) UserService.getUser(principal.getName()) 로 작성자 SiteUser 를 조회합니다.
		    4) AnswerService.create(question, content, siteUser) 로 answer 테이블에 INSERT 합니다.
		    5) 질문 상세 화면으로 redirect 되어 등록한 답변이 목록에 보입니다.
         -->
        <input type="submit" value="답변등록" class="btn btn-primary my-2">
        
    </form>
</div>


	<script layout:fragment="script" type='text/javascript'>
	
		//document.getElementsByClassName("delete"); 
		// class="delete" 인 <a>삭제</a> 링크들을 유사배열에 담아 다중 선택해서 저장 
		const delete_elements = document.getElementsByClassName("delete");
		
		//Array.from(delete_elements)
		//	getElementsByClassName 이 돌려준 결과는 배열과 비슷하지만 forEach 를 바로 쓸 수 없습니다.
		//  Array.from() 으로 진짜 배열로 바꿔 forEach 를 쓸 수 있게 합니다.
		
		//.forEach(function(element) { ... })
		//     배열의 요소를 하나씩 꺼내면서 아래 함수를 한 번씩 실행합니다.
		//     element : 현재 차례의 [삭제] 링크 한 개를 가리키는 변수입니다.
		//     링크가 여러 개면 각 링크마다 같은 작업을 등록합니다.
		Array.from(delete_elements).forEach(function(element) {
			
			//<a>삭제<a>들을 반복해서 "click" 이벤트 등록후  이벤처리 함수 function(){}이 실행되게 작성 
		    element.addEventListener('click', function() {
		    	
		    	//confirm("정말로 삭제하시겠습니까?")
		        //     브라우저 기본 확인창을 띄웁니다.
		        //     [확인] 을 누르면 true, [취소] 를 누르면 false 를 돌려줍니다.
		        //     if 는 true 일 때만 중괄호 안의 코드를 실행합니다.
		        //     → [취소] 를 누르면 아무 일도 일어나지 않고 화면이 그대로 유지됩니다
		        if(confirm("정말로 삭제하시겠습니까?")) {
		        	
		        	//this.dataset.uri
		            //     this : 클릭된 그 <a>삭제</a>링크 자신을 가리킵니다.
		            //     dataset : 링크에 붙은 data-* 속성 모음입니다.
		            //     .uri : 이름이 data-uri 인 속성의 값을 읽습니다.
		            
		            //질문 <a>삭제</a> 경우 
		            //     이 값은 서버(Thymeleaf)가 th:data-uri="@{|/question/delete/${question.id}|}" 로 만들어 넣은 것입니다.
		            //     예) 삭제할 질문 ID가  5 이면 "/question/delete/5" 가 됩니다.
		            
		            //답변 <a>삭제</a> 경우 
		            //      th:data-uri="@{|/answer/delete/${answer.id}|}
		            //	   예) 삭제할 답변 ID가  5 이면 "/answer/delete/5" 가 됩니다.
		            location.href = this.dataset.uri;
		
				//  location.href = "/question/delete/5";  <=== 질문 삭제 재요청
		        //  location.href = "/answer/delete/5";    <=== 답변 삭제 재요청
					
		        };
		    });
		});	
		
		//추천 요청 기능!!
		
		const recommend_elements = document.getElementsByClassName("recommend");
		
		Array.from(recommend_elements).forEach(function(element) {
			
		    element.addEventListener('click', function() {
		    	
		        if(confirm("정말로 추천하시겠습니까?")) {
		        									    //질문 추천 요청 : 추천버튼 눌렀을때 추천인 한명 생성해서 DB에 등록해줘~
		            location.href = this.dataset.uri;   //GET  /question/vote/${question.id}
		            							
		            									//답변 추천 요청 : 추천버튼 눌렀을때 추천인 한명 생성해서 DB에 등록해줘~
		            									//GET  /answer/vote/${answer.id}
		            
		        };
		    });
		});
		
	</script>

</html>


<!--layout.html 템플릿을 상속하려고 <html layout:decorate="~{layout}">을 사용했다. 
	
	타임리프의 layout:decorate 속성은 템플릿의 레이아웃(부모 템플릿, 여기서는 layout.html)으로 
	사용할 템플릿을 설정한다.
	
	속성값인 ~{layout}이 바로 layout.html 파일을 의미한다.
-->
<html layout:decorate="~{layout}">

<div  layout:fragment="content"   class="container my-3">
    <table class="table">
        <thead class="table-dark">
            <tr>
                <th>번호</th>
                <th>제목</th>
                <th>작성일시</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="question, loop : ${paging}">           
            	<td th:text="${paging.getTotalElements - (paging.number * paging.size) - loop.index}"></td>               
                <td>
                    <a th:href="@{|/question/detail/${question.id}|}" th:text="${question.subject}"></a>
                    
                    <!-- th:if="${#lists.size(question.answerList) > 0}"로 답변이 있는지 조사하고, -->
                    <!-- th:text="${#lists.size(question.answerList)}"로 답변 개수를 표시했다. -->
                    <span class="text-danger small ms-2"
                        th:if="${#lists.size(question.answerList) > 0}" 
                        th:text="${#lists.size(question.answerList)}">               
                    </span>
                    
                </td>
                <td th:text="${#temporals.format(question.createDate, 'yyyy-MM-dd HH:mm')}"></td>
            </tr>  
        </tbody>
    </table>
    
    <!-- 페이징처리 시작 -->
    <!--/*
		[페이지 번호 버튼 영역] 아래부터 "이전 1 2 3 다음" 버튼을 만듭니다.
		QuestionController 가 넘겨준 paging(Page<조회된 Question 10개>)의 정보를 사용합니다.
		
	    	model.addAttribute("paging", paging);

	*/-->
    <div th:if="${!paging.isEmpty()}">
   		<!--/*
			[th:if="${!paging.isEmpty()}"]
			  조회된 질문이 1개 이상 있을 때만 이 div(페이지 번호 영역)를 보여 줍니다.
			  isEmpty() 는 질문이 없으면 true 를 돌려주므로, 앞에 ! 를 붙여 "질문이 있으면"으로 뒤집습니다.
		*/-->
		
        <ul class="pagination justify-content-center">
        
       														 
            <li class="page-item" th:classappend="${!paging.hasPrevious} ? 'disabled'">
  				<!--/*
					[이전 버튼]
					  th:classappend="${!paging.hasPrevious} ? 'disabled'"
					    : 이전 페이지가 없으면(hasPrevious 가 false 이면) 버튼을 'disabled'(누를 수 없음) 상태로 만듭니다.
					    ! 는 "아니다"라는 뜻이므로, 이전 페이지가 없을 때 disabled 가 붙습니다.
					  th:href="@{|?page=${paging.number-1}|}"
					    : 현재 페이지 번호(paging.number)에서 1을 뺀 번호로 이동합니다.
					    주소는 같은 목록 주소에 ?page=번호 만 붙입니다. 예) /question/list?page=1
				*/-->
                <a class="page-link"
                    th:href="@{|?page=${paging.number-1}|}">
                    <span>이전</span>
                </a>
            </li>
            
            <!--/*
				[숫자 버튼(하단에 보일 페이지번호) 반복]
				  th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"
				    : 0 부터 (전체 페이지 수 - 1) 까지의 숫자 목록을 만들고, 숫자 하나씩 반복합니다.
				      전체 페이지가 3개면 0, 1, 2 를 만듭니다.
				      화면에 보이는 번호는 page + 1 이 아니라 page 그대로 출력합니다.
				      (아래 th:text="${page}" 참고: 이 화면은 0부터 시작하는 번호를 그대로 보여 줍니다)
				  th:if="${page >= paging.number-5 and page <= paging.number+5}"
				    : 현재 페이지 기준 앞뒤 5개 범위의 번호만 보여 줍니다.
				      페이지가 많아도 버튼이 너무 길어지지 않도록 하는 장치입니다.
				  th:classappend="${page == paging.number} ? 'active'"
				    : 지금 보고 있는 페이지 번호 버튼에는 'active'(강조) 표시를 붙입니다.
			*/-->
            <li th:each="page: ${#numbers.sequence(0, paging.totalPages-1)}"        
            	th:if="${page >= paging.number-5 and page <= paging.number+5}"          	
                th:classappend="${page == paging.number} ? 'active'" 
                class="page-item">
                
           	   <!--/*
					[숫자 버튼 (하단에 보일 페이지 번호 버튼) 링크]
					  th:text="${page}" : 버튼에 보일 페이지 번호입니다.
					  th:href="@{|?page=${page}|}" : 클릭하면 그 페이지 번호로 이동합니다.
				*/-->
                <a th:text="${page}" class="page-link" th:href="@{|?page=${page}|}"></a>              
            </li>
            
            
            <li class="page-item" th:classappend="${!paging.hasNext} ? 'disabled'">
            <!--/*
					[다음 버튼]
					  다음 페이지가 없으면(hasNext 가 false 이면) disabled 가 붙어 누를 수 없게 됩니다.
					  th:href="@{|?page=${paging.number+1}|}" : 현재 번호에서 1을 더한 페이지로 이동합니다.
			*/-->         
                <a class="page-link" th:href="@{|?page=${paging.number+1}|}">
                    <span>다음</span>
                </a>
            </li>
            
        </ul>
    </div>
    <!-- 페이징처리 끝 -->
    
    
	<a th:href="@{/question/create}" class="btn btn-primary">질문 등록하기</a>
</div>
</html>
